<svg viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4B400"/>
      <stop offset="1" stop-color="#8B5FD1"/>
    </linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <circle cx="330" cy="150" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="330" cy="150" r="98" fill="none" stroke="#F4B400" stroke-width="1.4" opacity="0.35"/>

  <!-- radiating baraka rays -->
  <g stroke="#F4B400" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <line x1="330" y1="30" x2="330" y2="6"/>
    <line x1="410" y1="60" x2="428" y2="42"/>
    <line x1="250" y1="60" x2="232" y2="42"/>
    <line x1="450" y1="150" x2="474" y2="150"/>
    <line x1="210" y1="150" x2="186" y2="150"/>
  </g>

  <!-- open book -->
  <g transform="translate(90,300)">
    <path d="M0 40 C60 10 130 10 190 40 V180 C130 152 60 152 0 180 Z" fill="url(#hg2)"/>
    <path d="M190 40 C250 10 320 10 380 40 V180 C320 152 250 152 190 180 Z" fill="#ffffff" opacity="0.75"/>
    <path d="M190 40 V180" stroke="#5B2C90" stroke-width="3"/>
    <g stroke="#5B2C90" stroke-width="2" opacity="0.5">
      <line x1="30" y1="72" x2="150" y2="58"/>
      <line x1="30" y1="96" x2="150" y2="84"/>
      <line x1="30" y1="120" x2="140" y2="110"/>
      <line x1="230" y1="58" x2="350" y2="72"/>
      <line x1="230" y1="84" x2="350" y2="96"/>
      <line x1="240" y1="110" x2="350" y2="120"/>
    </g>
  </g>

  <!-- floating badge -->
  <g transform="translate(370,330)">
    <circle r="46" fill="url(#hg1)"/>
    <path d="M-14 2 L-4 14 L16 -12" stroke="#3D1B65" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- track lanes at base referencing Kapsabet's running heritage -->
  <g stroke-linecap="round" fill="none">
    <path d="M-20 520 C120 480 380 480 540 520" stroke="#F4B400" stroke-width="3" opacity="0.55"/>
    <path d="M-20 545 C120 508 380 508 540 545" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
  </g>
</svg>
